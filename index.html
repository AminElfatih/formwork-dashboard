.toolbar select,.toolbar input,.toolbar button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px}
.toolbar button{cursor:pointer}
.toolbar button:hover{background:var(--sub)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.tabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:900px}

.kpi .k .en-h2{display:block;font-weight:400;font-size:10px;opacity:.8;margin-top:1px}

.leaf td{color:var(--ink)}
.toggle{cursor:pointer;display:inline-block;width:16px;color:var(--accent);user-select:none}
.sep{color:var(--line);margin:0 4px}
.en{color:var(--muted);font-style:italic;font-size:11px;margin-left:6px;font-weight:400}
.hint{color:var(--muted);font-size:12px;margin:6px 0}
.hidden{display:none}
.num{font-variant-numeric:tabular-nums}

  .av-h{background:#e6f7ec;font-weight:700}

.legend-line{width:22px;height:2px;background:#dc2626;position:relative}
.legend-line::after{content:"";position:absolute;right:0;top:-2px;width:6px;height:6px;background:#dc2626;border-radius:50%}

.flat-ov{padding:10px 4px 14px}

.ov-table tr:last-child td{background:#fffaf0}
.ov-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}

  const fC=document.getElementById("fCountry").value, q=document.getElementById("fSearch").value.trim().toLowerCase();
  const t=document.getElementById("flatTable"); const u=U();
  let html=`<thead><tr>${H("国别","Country","name")}${H("品类名称(汇总)","Category","name")}${H(u.asset,u.assetEn)}${H(u.on,u.onEn)}${H(u.av,u.avEn)}${H("出租率","Rental Rate")}${H(u.repair,u.repairEn)}${H(u.transit,u.transitEn)}</tr></thead><tbody>`;
  DATA.flat.forEach(r=>{
    if(fC!=="ALL"&&r.country!==fC) return;
    if(q&&!(r.category.toLowerCase().includes(q)||(r.category_en||"").toLowerCase().includes(q)||r.country.toLowerCase().includes(q))) return;
    const b=r[UNIT];
    const en=r.category_en?`<span class="en">${r.category_en}</span>`:"";
    html+=`<tr><td class="name">${r.country}</td><td class="name">${r.category}${en}</td><td class="num">${fmt(b.assets)}</td><td class="num">${fmt(b.on)}</td><td class="num">${fmt(b.avail)}</td>${rateCell(b.rate)}<td class="num">${fmt(r.extra.repair)}</td><td class="num">${fmt(r.extra.transit)}</td></tr>`;
  });
  html+="</tbody>"; t.innerHTML=html;
}
function renderFlatOverview(){
  const u=U();
  const el=document.getElementById("flatOverview");
  let rows="";
  DATA.tree.forEach(c=>{
    const b=c[UNIT];
    const color = c.name==="UAE" ? "#1a73e8" : "#f9ab00";
    const cnName = c.name==="UAE" ? "阿联酋 UAE" : "阿曼 Oman";
    rows+=`<tr>
      <td class="name"><span class="ov-dot" style="background:${color}"></span>${cnName}</td>
      <td class="num">${fmt(b.assets)}</td>
      <td class="num">${fmt(b.on)}</td>
      <td class="num">${fmt(b.avail)}</td>
      ${rateCell(b.rate)}
    </tr>`;
  });
  el.innerHTML=`<div class="ov-title">国别概览 · Country Overview<span class="en-h2">${UNIT==="w"?"按重量（吨）Weight (t）":"按数量（Pcs/m） Quantity (Pcs/m)"} · 各国家总资产 / 在租 / 出租率</span></div>
    <table class="ov-table"><thead><tr>${H("国别","Country","name")}${H(u.asset,u.assetEn)}${H(u.on,u.onEn)}${H(u.av,u.avEn)}${H("出租率","Rental Rate")}</tr></thead><tbody>${rows}</tbody></table>`;
}
function bindToggles(t){
  t.querySelectorAll(".toggle[data-toggle]").forEach(sp=>{
    sp.addEventListener("click",e=>{
      e.stopPropagation();
      const row=sp.closest("tr"), type=row.getAttribute("data-type");
      const isOpen=sp.getAttribute("data-open")==="1";
      sp.setAttribute("data-open",isOpen?"0":"1"); sp.textContent=isOpen?"▸":"▾";
      let sib=row.nextElementSibling; const base=depthOf(row);
      while(sib){ const d=depthOf(sib); if(d<=base) break;
        if(type==="country") sib.classList.toggle("hidden",isOpen);
        else if(d===base+1) sib.classList.toggle("hidden",isOpen);
        sib=sib.nextElementSibling; }
    });
  });
}
function depthOf(row){ const td=row.querySelector("td.name"); const m=(td?td.textContent:"").match(/^　+/); return m?m[0].length:0; }
function expandAll(open){ const t=document.getElementById("treeTable");
  t.querySelectorAll(".toggle[data-toggle]").forEach(sp=>{ const row=sp.closest("tr"), type=row.getAttribute("data-type");
    sp.setAttribute("data-open",open?"1":"0"); sp.textContent=open?"▾":"▸";
    let sib=row.nextElementSibling; const base=depthOf(row);
    while(sib){ const d=depthOf(sib); if(d<=base) break;
      if(type==="country") sib.classList.toggle("hidden",!open); else if(d===base+1) sib.classList.toggle("hidden",!open);
      sib=sib.nextElementSibling; } });
}
function renderKpis(){
  const el=document.getElementById("kpis"), fC=document.getElementById("fCountry").value; const u=U();
  const nodes=DATA.tree.filter(c=>fC==="ALL"||c.name===fC);
  let A=0,O=0,V=0; nodes.forEach(c=>{const b=B(c);A+=b.assets;O+=b.on;V+=b.avail;});
  const rate=A?O/A:0;
  el.innerHTML=`
   <div class="kpi"><div class="k">Country</div><div class="v">${fC==="ALL"?"UAE + Oman":(fC==="UAE"?"UAE":"Oman")}</div></div>
   <div class="kpi"><div class="k">${u.assetEn}</div><div class="v num">${fmt(A)}</div></div>
   <div class="kpi"><div class="k">${u.onEn}</div><div class="v num">${fmt(O)}</div></div>
   <div class="kpi"><div class="k">${u.avEn}</div><div class="v num">${fmt(V)}</div></div>
   <div class="kpi"><div class="k">Overall Rental Rate</div><div class="v num" style="color:${rateColor(rate)}">${pct(rate)}</div><div class="s">K6 Target ${pct(TARGET)}</div></div>`;
}
function renderChart(){
  const fC=document.getElementById("fCountry").value;
  let items=DATA.flat.filter(r=>fC==="ALL"||r.country===fC).map(r=>{
    const b=r.w;
    return {label:`${r.country}-${r.category}${r.category_en?"\n"+r.category_en:""}`, short:`${r.country}-${r.category}`, en:r.category_en||"", assets:b.assets, rate:b.rate==null?0:(b.rate*100), country:r.country};
  }).sort((a,b)=>b.assets-a.assets);
  if(items.length===0){ document.getElementById("chartScroll").innerHTML="<p style='text-align:center;color:var(--muted)'>无数据</p>"; return; }
  const maxA=Math.max(...items.map(i=>i.assets))||1;
  const barW=58, gap=22, margin={l:66,r:56,t:24,b:118};
  const W=margin.l+items.length*(barW+gap)+margin.r, H=360;
  const y1=y=>margin.t+(H-margin.t-margin.b)*(1-y/maxA);
  const y2=y=>margin.t+(H-margin.t-margin.b)*(1-y/100);
  let bars="", points=[], labels="", grid="";
  // grid lines (5)
  for(let i=0;i<=5;i++){
    const y=margin.t+(H-margin.t-margin.b)*(1-i/5);
    grid+=`<line x1="${margin.l}" y1="${y}" x2="${W-margin.r}" y2="${y}" stroke="#e3e8ef" stroke-width="1"/>`;
    grid+=`<text x="${margin.l-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#6b7a8d">${(maxA*i/5/1000).toFixed(0)}k</text>`;
    grid+=`<text x="${W-margin.r+8}" y="${y+4}" text-anchor="start" font-size="10" fill="#6b7a8d">${(i*20)}%</text>`;
  }
  items.forEach((it,i)=>{
    const x=margin.l+i*(barW+gap)+gap/2;
    const y=y1(it.assets);
    const h=H-margin.b-y;
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="#1e3a8a" rx="2"/>`;
    bars+=`<text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="10" fill="#1f2d3d" font-weight="600">${it.assets>=1000?(it.assets/1000).toFixed(1)+"k":it.assets.toFixed(0)}</text>`;
    points.push({x:x+barW/2,y:y2(it.rate),v:it.rate});
    // x labels: Chinese category + English (two lines, rotated)
    const lx=x+barW/2, ly=H-margin.b+16;
    labels+=`<text x="${lx}" y="${ly}" text-anchor="end" font-size="10" fill="#1f2d3d" transform="rotate(-45,${lx},${ly})"><tspan x="${lx}" dy="0">${escapeXml(it.short)}</tspan>${it.en?`<tspan x="${lx}" dy="12">${escapeXml(it.en)}</tspan>`:""}</text>`;
  });
  // line
  let linePath="";
  points.forEach((p,i)=>{ linePath+=(i===0?"M":"L")+`${p.x},${p.y}`; });
  let lineSvg=`<path d="${linePath}" fill="none" stroke="#dc2626" stroke-width="2"/>`;
  points.forEach(p=>{
    lineSvg+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>`;
    lineSvg+=`<text x="${p.x}" y="${p.y-10}" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">${p.v.toFixed(0)}%</text>`;
  });
  // axes
  const axis=`<line x1="${margin.l}" y1="${H-margin.b}" x2="${W-margin.r}" y2="${H-margin.b}" stroke="#94a3b8" stroke-width="1"/><line x1="${margin.l}" y1="${margin.t}" x2="${margin.l}" y2="${H-margin.b}" stroke="#94a3b8" stroke-width="1"/><line x1="${W-margin.r}" y1="${margin.t}" x2="${W-margin.r}" y2="${H-margin.b}" stroke="#94a3b8" stroke-width="1"/>`;
  const svg=`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid}${axis}${bars}${lineSvg}${labels}</svg>`;
  document.getElementById("chartScroll").innerHTML=svg;
  document.getElementById("chartTitle").textContent=fC==="ALL"?"阿联酋阿曼模架材料出租情况":(fC==="UAE"?"阿联酋模架材料出租情况":"阿曼模架材料出租情况");
}
function escapeXml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;"}[c])); }
function refresh(){ renderKpis(); renderTree(); renderFlat(); renderFlatOverview(); renderChart(); }
document.getElementById("meta").textContent=`Generated: ${DATA.generated_at} | Warehouses: ${WH.join(", ")} | ` + DATA.tree.map(c=>`${c.name}: ${pct(c.w.rate)}`).join("  ·  ");
document.getElementById("fUnit").onchange=e=>{UNIT=e.target.value;refresh();};
document.getElementById("fCountry").onchange=refresh;
document.getElementById("fSearch").oninput=()=>{renderTree();renderFlat();};
document.getElementById("btnExpand").onclick=()=>expandAll(true);
document.getElementById("btnCollapse").onclick=()=>expandAll(false);
document.getElementById("tabTree").onclick=()=>switchTab("tree");
document.getElementById("tabFlat").onclick=()=>switchTab("flat");
document.getElementById("tabChart").onclick=()=>switchTab("chart");
function switchTab(which){
  document.getElementById("tabTree").classList.toggle("active",which==="tree");
  document.getElementById("tabFlat").classList.toggle("active",which==="flat");
  document.getElementById("tabChart").classList.toggle("active",which==="chart");
  document.getElementById("treeTable").classList.toggle("hidden",which!=="tree");
  document.getElementById("flatWrap").classList.toggle("hidden",which!=="flat");
  document.getElementById("chartPanel").classList.toggle("hidden",which!=="chart");
}
refresh();
</script>
</body>
</html>
